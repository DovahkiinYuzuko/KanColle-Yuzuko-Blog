name: Release kctemp

on:
  push:
    tags:
      - 'kctemp/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#kctemp/}" >> "$GITHUB_OUTPUT"

      - name: Create release zip
        run: |
          mkdir -p _release
          cd kctemp && zip -r ../_release/kctemp-${{ steps.version.outputs.version }}.zip \
            bin/ \
            src/ \
            package.json \
            package-lock.json \
            README.md \
            LICENSE.MIT \
            NOTICE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: kctemp ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: _release/kctemp-${{ steps.version.outputs.version }}.zip
          body: |
            ## kctemp ${{ steps.version.outputs.version }}

            ### セットアップ手順

            1. 下記の zip ファイルをダウンロードして解凍します。
            2. 解凍したフォルダ内で以下を実行します。

            ```bash
            npm install
            npm link
            ```

            3. `kctemp` コマンドが利用可能になります。

            ### Setup Instructions

            1. Download and extract the zip file below.
            2. Run the following commands inside the extracted folder.

            ```bash
            npm install
            npm link
            ```

            3. The `kctemp` command is now available globally.
